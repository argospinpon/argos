<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARGOS Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: barra de control arriba, pista 16:9 centrada que ocupa el resto, ayuda abajo.
   Tema único y deliberado: la pantalla nocturna de ARGOS. */
:root{
  --noche:#0E2A5C; --noche-2:#0A2048; --azul:#2E7CF6; --cielo:#EAF2FE;
  --mandarina:#FF8A1F; --sol:#FFD23F; --gris:#5B6B82; --linea:rgba(234,242,254,.14);
  --f-ui:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--noche-2);color:var(--cielo);font-family:var(--f-ui);margin:0;
  padding-inline:16px;padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.marca{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.35rem;letter-spacing:.01em}
.marca img{width:30px;height:auto}
.controles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grupo{display:flex;background:rgba(234,242,254,.07);border-radius:999px;padding:3px}
.grupo button,.icono{font:800 .85rem var(--f-ui);color:var(--cielo);background:none;border:0;
  padding:7px 14px;border-radius:999px;cursor:pointer;letter-spacing:.01em}
.grupo button[aria-pressed="true"]{background:var(--azul);color:#fff}
.grupo button:hover:not([aria-pressed="true"]),.icono:hover{background:rgba(234,242,254,.1)}
.icono{background:rgba(234,242,254,.07)}
button:focus-visible{outline:2px solid var(--sol);outline-offset:2px}
#dificultad[hidden]{display:none!important}
.pista{flex:1;min-height:0;display:grid;place-items:center}
canvas{display:block;border-radius:18px;background:var(--noche);touch-action:none;cursor:none;
  box-shadow:0 0 0 1px var(--linea)}
footer{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-weight:600;font-size:.82rem;color:rgba(234,242,254,.62)}
kbd{font:800 .75rem var(--f-ui);background:rgba(234,242,254,.1);border-radius:6px;padding:2px 7px;color:var(--cielo)}
@media (max-width:560px){.marca{font-size:1.1rem}.grupo button,.icono{padding:6px 10px;font-size:.78rem}}
</style>
</head>
<body>


<header>
  <div class="marca"><img id="logoMarca" alt=""> ARGOS Pong</div>
  <div class="controles">
    <div class="grupo" role="group" aria-label="Modo de juego">
      <button id="m1" aria-pressed="true">1 jugador</button>
      <button id="m2" aria-pressed="false">2 jugadores</button>
    </div>
    <div class="grupo" id="dificultad" role="group" aria-label="Dificultad">
      <button id="d0" aria-pressed="false">Fácil</button>
      <button id="d1" aria-pressed="true">Normal</button>
      <button id="d2" aria-pressed="false">Difícil</button>
    </div>
    <button class="icono" id="sonido" aria-pressed="true">Sonido: sí</button>
    <button class="icono" id="pantalla">Pantalla completa</button>
  </div>
</header>
<div class="pista" id="pista"><canvas id="c" aria-label="Pista de ping pong"></canvas></div>
<footer id="ayuda"></footer>

const COL = {noche:'#0E2A5C', azul:'#2E7CF6', cielo:'#EAF2FE', mandarina:'#FF8A1F', sol:'#FFD23F', gris:'#5B6B82', blanco:'#FFFFFF'};

const BOLA_W = 70, BOLA_H = Math.round(70*307/320);
// Rival "humano": lee bien las pelotas lentas y coloca la devolución lejos de ti;

const DIFIC = [

// ---------- Cara de ARGOS (misma geometría que el GIF) ----------
const head = new Image(); head.src = HEAD_SRC;
const FW = 320, FH = 307, SC = 320/2196;
const P = (x,y)=>[(x-950)*SC, (y-1002)*SC];
const off = document.createElement('canvas'); off.width = FW; off.height = FH;
const oc = off.getContext('2d');
const NEUTRA = {ap_i:1, ap_d:1, fe_i:0, fe_d:0, esc:1, mw:288, y:1940, d:105, t:118, ab:0, e:0, o:0};
const GESTOS = {
  contento:{mw:340, y:1910, d:170},
  guino:{fe_d:1, mw:348, y:1900, d:180},
  risa:{fe_i:1, fe_d:1, mw:328, y:1960, d:60, ab:1, e:180},
  sorpresa:{esc:1.15, mw:105, y:2010, d:0, t:0, o:1},
  picaro:{fe_i:1, mw:300, y:1930, d:140},
  concentrado:{ap_i:.55, ap_d:.55, mw:200, y:1960, d:30},
};
const cara = {cur:{...NEUTRA}, gesto:null, hasta:0, parp:-1, sigParp:1.5, gx:0, gy:0, entorna:0};
function gesto(nombre, seg){ cara.gesto = nombre; cara.hasta = reloj + seg; }
const lerp=(a,b,t)=>a+(b-a)*t;
const N_P = 28;
function ojo(cx,cy,ap,fe,esc){
  const r = 196*esc, w = lerp(r,170,fe), sup=[], inf=[];
  for(let i=0;i<=N_P;i++){
    const u=-1+2*i/N_P, x=cx+u*w, circ=Math.sqrt(Math.max(0,1-u*u));
    const arco=cy+60-115*(1-u*u), semi=Math.max(r*ap,20)*circ;
    sup.push(P(x, lerp(cy-semi, arco-45, fe))); inf.push(P(x, lerp(cy+semi, arco+45, fe)));
  }
  poli(sup.concat(inf.reverse()));
  if(fe>.01){ const rr=45*fe*SC; for(const x of [cx-w,cx+w]){ const [px,py]=P(x,cy+60); circulo(px,py,rr);} }
}
function boca(p){
  const sup=[], inf=[];
  for(let i=0;i<=N_P;i++){
    const u=-1+2*i/N_P, x=2048+u*p.mw, q=1-u*u, c=p.y+p.d*q, ci=p.o*p.mw*Math.sqrt(Math.max(0,q));
    sup.push(P(x, c-p.t/2-p.ab*p.d*q-ci)); inf.push(P(x, c+p.t/2+p.ab*p.e*q+ci));
  }
  poli(sup.concat(inf.reverse()));
  if(p.t>1){ const rr=p.t/2*SC; for(const x of [2048-p.mw,2048+p.mw]){ const [px,py]=P(x,p.y); circulo(px,py,rr);} }
}
function poli(pts){ oc.beginPath(); oc.moveTo(pts[0][0],pts[0][1]); for(const q of pts) oc.lineTo(q[0],q[1]); oc.closePath(); oc.fill(); }
function circulo(x,y,r){ oc.beginPath(); oc.arc(x,y,r,0,Math.PI*2); oc.fill(); }

function actualizaCara(dt){
  const obj = {...NEUTRA, ...(cara.gesto && reloj<cara.hasta ? GESTOS[cara.gesto] : {})};
  if(reloj>=cara.hasta) cara.gesto=null;
  const k = 1-Math.pow(1-0.2, dt*60);
  for(const key in obj) cara.cur[key] = lerp(cara.cur[key], obj[key], k);
  // parpadeo
  cara.sigParp -= dt;
  if(cara.sigParp<=0 && cara.parp<0){ cara.parp=0; cara.sigParp = 1.8+Math.random()*3.2; }
  if(cara.parp>=0){ cara.parp += dt; if(cara.parp>0.28) cara.parp=-1; }
  cara.entorna = Math.max(0, cara.entorna - dt*4);
  // mirada hacia donde va la bola
  const b=S.bola, sp=Math.hypot(b.vx,b.vy)||1;
  const tx = S.fase==='juego' ? 45*b.vx/sp*1.3 : 0, ty = S.fase==='juego' ? 40*b.vy/sp*1.3 : 0;
  cara.gx = lerp(cara.gx, tx, k); cara.gy = lerp(cara.gy, ty, k);
}
const CURVA_P = t => t<0 ? 1 : 1 - 0.96*Math.sin(Math.PI*Math.min(1,t/0.28));
function pintaCara(color){
  const p=cara.cur;
  let cierre = CURVA_P(cara.parp) * (1-0.5*Math.sin(Math.PI*Math.min(1,cara.entorna)));
  oc.globalCompositeOperation='source-over'; oc.clearRect(0,0,FW,FH);
  if(head.complete) oc.drawImage(head,0,0,FW,FH);
  oc.globalCompositeOperation='destination-out'; oc.fillStyle='#000';
  const at = 1-(p.esc-1)/0.15;
  ojo(1603+cara.gx*at, 1600+cara.gy*at, p.ap_i*cierre, p.fe_i, p.esc);
  ojo(2492+cara.gx*at, 1600+cara.gy*at, p.ap_d*cierre, p.fe_d, p.esc);
  boca(p);
  oc.globalCompositeOperation='source-in'; oc.fillStyle=color; oc.fillRect(0,0,FW,FH);
  oc.globalCompositeOperation='source-over';
}

// ---------- Sonido ----------
let ac=null;
function pip(f, dur=.07, tipo='square', vol=.05){
  if(!S.sonido) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=tipo; o.frequency.value=f; g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}

// ---------- Juego ----------
const nombres = ()=> S.modo===1 ? ['Tú','Máquina'] : ['Jugador 1','Jugador 2'];
function nuevaPartida(){
  S.marcador=[0,0]; S.ganador=null; S.saca=Math.random()<.5?0:1;
  S.izq.y=S.der.y=H/2; S.bola.color=0;
  prepararSaque();
}
function prepararSaque(){
  const b=S.bola; b.x=W/2; b.y=H/2; b.vx=b.vy=0; b.golpes=0;
  S.fase='saque'; S.temporizador=0.9;
}
function sacar(){
  const b=S.bola, dir = S.saca===0 ? 1 : -1;
  const ang = (Math.random()*.6-.3);
  const v = 380;
  b.vx = dir*v*Math.cos(ang); b.vy = v*Math.sin(ang);
  S.fase='juego'; pip(520,.06,'triangle');
}
function punto(quien){
  S.marcador[quien]++; S.saca = quien===0 ? 1 : 0;
  pip(quien===0?660:220,.25,'triangle',.06);
  if(S.marcador[quien]>=META){
    S.fase='fin'; S.ganador=quien; gesto('risa', 999);
    return;
  }
  S.fase='punto'; S.temporizador=1.3;
  if(S.modo===1) gesto(quien===0?'sorpresa':'guino', 1.3);
  else gesto('sorpresa', 1.3);
}

function moverPala(pala, dt, arriba, abajo, vel=620){
  if(pala.obj!=null){ pala.y = lerp(pala.y, pala.obj, 1-Math.pow(1-.35, dt*60)); }
  if(arriba) { pala.y -= vel*dt; pala.obj=null; }
  if(abajo)  { pala.y += vel*dt; pala.obj=null; }
  pala.y = Math.max(PALA.h/2, Math.min(H-PALA.h/2, pala.y));
}
const gauss = ()=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
function prediceY(b){
  const t = (W-PALA.margen-PALA.w-BOLA_W/2 - b.x)/b.vx;
  let y = b.y + b.vy*t;
  const lo=BOLA_H/2, hi=H-BOLA_H/2, span=hi-lo;
  y -= lo; y = ((y%(2*span))+2*span)%(2*span); if(y>span) y=2*span-y;
  return y+lo;
}
function moverIA(dt){
  const d = DIFIC[S.dif], b=S.bola, pala=S.der, ia=S.ia;
  if(b.vx>0){
    if(!ia.sigue){                      // la pelota viene: ve el golpe y tarda en reaccionar
      ia.sigue = true;
      ia.espera = d.reaccion*(0.8+0.5*Math.random());
      const exceso = Math.max(0, Math.hypot(b.vx,b.vy)-d.umbral);   // solo falla si va rápida
      ia.sesgo = gauss()*d.errVel*exceso;
      // con tiempo de sobra, golpea con un lado de la pala para mandarla lejos de ti
      const lado = S.izq.y < H/2 ? 1 : -1;
      ia.apunta = exceso>0 ? 0 : lado*(12+Math.random()*20);
    }
    ia.espera -= dt;
    if(ia.espera<=0){
      const queda = Math.max(0, Math.min(1, (W-b.x)/W));       // corrige el cálculo al acercarse
      ia.obj = prediceY(b) - (ia.apunta||0) + ia.sesgo*(0.6 + 0.4*queda);
    }
  } else {
    ia.sigue = false;                     // la pelota se va: vuelve sin prisa hacia el centro
    ia.obj = H/2 + (b.y-H/2)*0.35;
  }
  // pala con inercia: acelera y frena, puede pasarse un poco
  const relajado = b.vx<0 ? 0.6 : 1;
  const deseada = Math.max(-d.vmax*relajado, Math.min(d.vmax*relajado, (ia.obj-pala.y)*9));
  const dv = deseada-ia.v, maxDv = d.acc*dt;
  ia.v += Math.max(-maxDv, Math.min(maxDv, dv));
  pala.y += ia.v*dt;
  if(pala.y<PALA.h/2){ pala.y=PALA.h/2; ia.v=0; }
  if(pala.y>H-PALA.h/2){ pala.y=H-PALA.h/2; ia.v=0; }
}

function choquePala(b, pala, xCara, dir){
  const top = pala.y-PALA.h/2, bot = pala.y+PALA.h/2;
  const bTop = b.y-BOLA_H/2, bBot = b.y+BOLA_H/2*0.55; // la cola de la cara no cuenta
  if(bBot<top || bTop>bot) return false;
  const rel = Math.max(-1, Math.min(1, (b.y - pala.y)/(PALA.h/2+BOLA_H/2)));
  const ang = rel * 0.95;
  const v = Math.min(Math.hypot(b.vx,b.vy)*1.06, 980);
  b.vx = dir*v*Math.cos(ang); b.vy = v*Math.sin(ang);
  b.x = xCara + dir*BOLA_W/2;
  b.golpes++; b.color = (b.color+1)%BOLA_COLORES.length;
  cara.entorna = 1; if(Math.random()<.45) gesto(['contento','picaro','guino'][Math.floor(Math.random()*3)], .7);
  pip(440+b.golpes*12,.06,'square');
  return true;
}

const teclas = {};
let reloj=0, ultimo=performance.now();
function paso(ahora){
  const dt = Math.min(.033, (ahora-ultimo)/1000); ultimo=ahora;
  if(S.fase!=='pausa') { reloj += dt; actualiza(dt); }
  actualizaCara(dt);
  pinta();
  requestAnimationFrame(paso);
}
function actualiza(dt){
  moverPala(S.izq, dt, teclas.w||(S.modo===1&&teclas.arriba), teclas.s||(S.modo===1&&teclas.abajo));
  if(S.modo===2) moverPala(S.der, dt, teclas.arriba, teclas.abajo);
  else if(S.fase==='juego') moverIA(dt);
  else { S.ia.sigue=false; S.ia.obj=H/2; S.der.y = lerp(S.der.y, H/2, 1-Math.pow(.97, dt*60)); S.ia.v=0; }

  if(S.fase==='saque' || S.fase==='punto'){
    S.temporizador -= dt;
    if(S.fase==='punto' && S.temporizador<=0) prepararSaque();
    else if(S.fase==='saque' && S.temporizador<=0) sacar();
    return;
  }
  if(S.fase!=='juego') return;
  const b=S.bola;
  b.x += b.vx*dt; b.y += b.vy*dt;
  if(b.y-BOLA_H/2<0){ b.y=BOLA_H/2; b.vy=Math.abs(b.vy); cara.parp=0; pip(300,.04,'sine'); }
  if(b.y+BOLA_H/2>H){ b.y=H-BOLA_H/2; b.vy=-Math.abs(b.vy); cara.parp=0; pip(300,.04,'sine'); }
  const xi = PALA.margen+PALA.w, xd = W-PALA.margen-PALA.w;
  if(b.vx<0 && b.x-BOLA_W/2<=xi && b.x-BOLA_W/2>=xi-28) choquePala(b, S.izq, xi, 1);
  if(b.vx>0 && b.x+BOLA_W/2>=xd && b.x+BOLA_W/2<=xd+28) choquePala(b, S.der, xd, -1);
  if(b.x+BOLA_W/2<0) punto(1);
  if(b.x-BOLA_W/2>W) punto(0);
}

// ---------- Dibujo ----------
function texto(t, x, y, size, color, peso=900, alinear='center'){
  ctx.font = `${peso} ${size}px Nunito, ui-rounded, system-ui, sans-serif`;
  ctx.fillStyle=color; ctx.textAlign=alinear; ctx.textBaseline='middle'; ctx.fillText(t,x,y);
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); ctx.fill(); }
function pinta(){
  ctx.fillStyle=COL.noche; ctx.fillRect(0,0,W,H);
  // red central
  ctx.fillStyle='rgba(234,242,254,.16)';
  for(let y=14;y<H;y+=34) rr(W/2-3,y,6,18,3);
  // marcador
  const n=nombres();
  texto(S.marcador[0], W/2-90, 64, 72, 'rgba(234,242,254,.85)');
  texto(S.marcador[1], W/2+90, 64, 72, 'rgba(234,242,254,.85)');
  texto(n[0].toUpperCase(), W/2-90, 112, 13, 'rgba(234,242,254,.45)', 800);
  texto(n[1].toUpperCase(), W/2+90, 112, 13, 'rgba(234,242,254,.45)', 800);
  // palas
  ctx.fillStyle=COL.sol; rr(PALA.margen, S.izq.y-PALA.h/2, PALA.w, PALA.h, 7);
  ctx.fillStyle=COL.mandarina; rr(W-PALA.margen-PALA.w, S.der.y-PALA.h/2, PALA.w, PALA.h, 7);
  // bola = ARGOS
  const b=S.bola;
  pintaCara(BOLA_COLORES[b.color]);
  ctx.drawImage(off, b.x-BOLA_W/2, b.y-BOLA_H/2, BOLA_W, BOLA_H);
  // mensajes
  const panel = (l1,l2)=>{
    ctx.fillStyle='rgba(10,32,72,.78)'; rr(W/2-250, H/2+60, 500, 110, 20);
    texto(l1, W/2, H/2+98, 30, COL.cielo);
    if(l2) texto(l2, W/2, H/2+138, 16, 'rgba(234,242,254,.7)', 700);
  };
  const tactil = matchMedia('(pointer: coarse)').matches;
  const accion = tactil ? 'Toca la pista' : 'Pulsa espacio o haz clic';
  if(S.fase==='inicio') panel(S.modo===1?'Tú contra la máquina':'Dos jugadores', `${accion} para empezar · gana quien llegue a ${META}`);
  if(S.fase==='pausa') panel('Pausa', `${accion} o pulsa P para seguir`);
  if(S.fase==='punto'){ const q = S.saca===1?0:1; panel(S.modo===1 ? (q===0?'¡Punto para ti!':'Punto para la máquina') : `Punto para ${n[q]}`, `${S.marcador[0]} – ${S.marcador[1]}`); }
  if(S.fase==='fin') panel(S.modo===1 ? (S.ganador===0?'¡Has ganado!':'Gana la máquina') : `¡Gana ${n[S.ganador]}!`, `${S.marcador[0]} – ${S.marcador[1]} · ${accion} para la revancha`);
}

// ---------- Tamaño ----------
function ajusta(){
  const r = pista.getBoundingClientRect();
  let w = r.width, h = w*9/16;
  if(h>r.height){ h=r.height; w=h*16/9; }
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
new ResizeObserver(ajusta).observe(pista);

// ---------- Controles ----------
function accionPrincipal(){
  if(S.fase==='inicio'||S.fase==='fin') nuevaPartida();
  else if(S.fase==='pausa') S.fase=S.faseAnterior;
}
function pausa(){
  if(S.fase==='pausa') S.fase=S.faseAnterior;
  else if(['juego','saque','punto'].includes(S.fase)){ S.faseAnterior=S.fase; S.fase='pausa'; }
}
const MAPA = {ArrowUp:'arriba', ArrowDown:'abajo', KeyW:'w', KeyS:'s'};
addEventListener('keydown', e=>{
  if(MAPA[e.code]){ teclas[MAPA[e.code]]=true; e.preventDefault(); }
  if(e.code==='Space'){ e.preventDefault(); accionPrincipal(); }
  if(e.code==='KeyP'||e.code==='Escape') pausa();
});
addEventListener('keyup', e=>{ if(MAPA[e.code]) teclas[MAPA[e.code]]=false; });
addEventListener('blur', ()=>{ for(const k in teclas) teclas[k]=false; });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && S.fase!=='pausa') pausa(); });

function yLogica(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointermove', e=>{
  const p=yLogica(e);
  if(S.modo===1 || p.x<W/2) S.izq.obj=p.y; else S.der.obj=p.y;
});
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture?.(e.pointerId); const p=yLogica(e);
  if(S.modo===1 || p.x<W/2) S.izq.obj=p.y; else S.der.obj=p.y;
  accionPrincipal(); });

function elegirModo(m){
  S.modo=m; document.getElementById('m1').setAttribute('aria-pressed', m===1);
  document.getElementById('m2').setAttribute('aria-pressed', m===2);
  document.getElementById('dificultad').hidden = m!==1;
  S.fase='inicio'; S.marcador=[0,0]; prepararReposo(); ayuda();
}
function prepararReposo(){ const b=S.bola; b.x=W/2; b.y=H/2-40; b.vx=b.vy=0; S.fase='inicio'; }
function elegirDif(d){ S.dif=d; [0,1,2].forEach(i=>document.getElementById('d'+i).setAttribute('aria-pressed', i===d)); }
document.getElementById('m1').onclick=()=>elegirModo(1);
document.getElementById('m2').onclick=()=>elegirModo(2);
[0,1,2].forEach(i=>document.getElementById('d'+i).onclick=()=>elegirDif(i));
document.getElementById('sonido').onclick=e=>{ S.sonido=!S.sonido; e.currentTarget.setAttribute('aria-pressed',S.sonido); e.currentTarget.textContent='Sonido: '+(S.sonido?'sí':'no'); };
document.getElementById('pantalla').onclick=()=>{
  const el=document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  else el.requestFullscreen?.().catch(()=>{});
};
function ayuda(){
  const f=document.getElementById('ayuda');
  f.innerHTML = S.modo===1
    ? '<span>Mueve tu pala amarilla con el ratón, el dedo o <kbd>W</kbd> <kbd>S</kbd> / <kbd>↑</kbd> <kbd>↓</kbd></span><span><kbd>Espacio</kbd> empezar · <kbd>P</kbd> pausa</span>'
    : '<span>Amarilla: <kbd>W</kbd> <kbd>S</kbd> o mitad izquierda</span><span>Naranja: <kbd>↑</kbd> <kbd>↓</kbd> o mitad derecha</span><span><kbd>Espacio</kbd> empezar · <kbd>P</kbd> pausa</span>';
}
try{ const m=+localStorage.getItem('argosPongModo'); if(m===2) S.modo=2; }catch(e){}
elegirModo(S.modo);
const _elegir=elegirModo; 
document.getElementById('m1').addEventListener('click',()=>{try{localStorage.setItem('argosPongModo','1')}catch(e){}});
document.getElementById('m2').addEventListener('click',()=>{try{localStorage.setItem('argosPongModo','2')}catch(e){}});
setInterval(()=>{ if(S.fase==='inicio' && !cara.gesto && Math.random()<.35) gesto(['contento','guino','picaro','risa'][Math.floor(Math.random()*4)], 1.1); }, 2200);
ajusta();
requestAnimationFrame(paso);
</script>
